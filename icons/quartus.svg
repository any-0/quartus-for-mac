<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g fill="#cbd5e1">
    <!-- pins -->
    <g id="pins-top">
      <rect x="372" y="262" width="28" height="70" rx="6"/>
      <rect x="436" y="262" width="28" height="70" rx="6"/>
      <rect x="500" y="262" width="28" height="70" rx="6"/>
      <rect x="564" y="262" width="28" height="70" rx="6"/>
      <rect x="628" y="262" width="28" height="70" rx="6"/>
    </g>
    <use href="#pins-top" transform="translate(0 430)"/>
    <use href="#pins-top" transform="rotate(90 512 512)"/>
    <use href="#pins-top" transform="rotate(90 512 512) translate(0 430)"/>
  </g>
  <rect x="322" y="322" width="380" height="380" rx="36" fill="url(#chip)" stroke="#94a3b8" stroke-width="6"/>
  <!-- logic cells -->
  <g fill="#60a5fa">
    <rect x="382" y="382" width="72" height="72" rx="12"/>
    <rect x="476" y="382" width="72" height="72" rx="12" fill="#22d3ee"/>
    <rect x="570" y="382" width="72" height="72" rx="12"/>
    <rect x="382" y="476" width="72" height="72" rx="12" fill="#22d3ee"/>
    <rect x="476" y="476" width="72" height="72" rx="12"/>
    <rect x="570" y="476" width="72" height="72" rx="12" fill="#22d3ee"/>
    <rect x="382" y="570" width="72" height="72" rx="12"/>
    <rect x="476" y="570" width="72" height="72" rx="12" fill="#22d3ee"/>
    <rect x="570" y="570" width="72" height="72" rx="12"/>
  </g>
</svg>
